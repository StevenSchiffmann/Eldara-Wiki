# Erzeugt vom Eldara-Build (updater/stages/render.py) — nicht von Hand bearbeiten:
# publish.py spiegelt dist_build/ mit `rsync --delete`, jede Handänderung wäre beim
# nächsten Publish weg.
#
# Die Seite ist bereits fertig gebautes, statisches HTML. Dieser Workflow kompiliert
# nichts, er lädt das Repo-Root als Pages-Artefakt hoch. Nötig, solange in den
# Repo-Einstellungen "Source: GitHub Actions" steht; bei "Deploy from a branch" wird
# er nicht gebraucht.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
